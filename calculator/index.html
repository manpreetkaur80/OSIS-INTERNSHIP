<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <h1>Calculator</h1>
    <div class="cal-c">
        
        <div class="box">
            <div class="input"></div>
        </div>
    
    <div class="box">
        <button class="btn clear">c</button>
        <button class="btn last">⌫</button>
        <button class="btn operator">/</button>
        <button class="btn operator">x</button>
    </div>
    
    <div class="box">
        <button class="btn no">7</button>
        <button class="btn no">8</button>
        <button class="btn no">9</button>
        <button class="btn operator">-</button>
    </div>
    
    <div class="box">
        <button class="btn no">4</button>
        <button class="btn no">5</button>
        <button class="btn no">6</button>
        <button class="btn operator">+</button>
    </div>
    
    <div class="box">
        <button class="btn no">1</button>
        <button class="btn no">2</button>
        <button class="btn no">3</button>
        <button class="btn equal evaluate">=</button>
    </div>
    <div class="box">
        <button class="btn no">0</button>
        <button class="btn no decimal">.</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
